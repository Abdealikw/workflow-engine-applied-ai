services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: engine
      POSTGRES_PASSWORD: password
      POSTGRES_DB: engine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://engine:password@postgres:5432/engine
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  orchestrator:
    build: .
    command: python -m src.orchestrator.main
    environment:
      - DATABASE_URL=postgresql+asyncpg://engine:password@postgres:5432/engine
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: python -m src.worker.main
    environment:
      - DATABASE_URL=postgresql+asyncpg://engine:password@postgres:5432/engine
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
